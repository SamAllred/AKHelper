name: Build release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(tr -d '\r\n ' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)."
            exit 1
          fi

      - name: Build updater package
        shell: bash
        run: |
          mkdir release
          cp EverQuest_Key_Helper.ahk Update_EverQuest_Key_Helper.ps1 VERSION EverQuest_Key_Helper_Final_Instructions.txt release/
          (cd release && zip -r ../EverQuest_Key_Helper_Update.zip .)
          zip EverQuest_Key_Helper_Full.zip EverQuest_Key_Helper.ahk Update_EverQuest_Key_Helper.ps1 Install_EverQuest_Key_Helper.ps1 Start_EverQuest_Key_Helper.ps1 VERSION EverQuest_Key_Helper_Final_Instructions.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" EverQuest_Key_Helper_Update.zip EverQuest_Key_Helper_Full.zip --generate-notes --title "EverQuest Key Helper $GITHUB_REF_NAME"
